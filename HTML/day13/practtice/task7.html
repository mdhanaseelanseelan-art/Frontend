<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Circle Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #f2f2f2;
            overflow: hidden;
        }

        .circle {
            width: 80px;
            height: 80px;
            background-color: blue;
            border-radius: 50%;

            position: absolute;
            left: 50%;
            transform: translateX(-50%);

            animation: moveCircle 3s linear infinite;
        }

        @keyframes moveCircle {

            0% {
                top: 0;
            }

            100% {
                top: calc(100vh - 80px);
            }

        }
    </style>
</head>

<body>

    <div style="background-color: black;" class="circle"></div>

</body>
</html>
